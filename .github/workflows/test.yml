name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/prompt-structurer-mcp/package-lock.json
      - run: npm ci
        working-directory: packages/prompt-structurer-mcp
      - run: npm test
        working-directory: packages/prompt-structurer-mcp
